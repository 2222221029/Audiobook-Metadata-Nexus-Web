name: audiobook-metadata-nexus

services:
  audiometa-nexus:
    image: ghcr.io/2222221029/audiobook-metadata-nexus-web:${AUDIOMETA_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: audiometa-nexus
    restart: unless-stopped
    env_file:
      - ./platform-credentials.env
    ports:
      - "8787:8787"
    volumes:
      - ${AUDIOMETA_CONFIG_DIR:-./docker/config}:/config
      - ${AUDIOMETA_DATA_DIR:-./docker/data}:/data
    environment:
      PROCESS_CONFIG: /config/process_params.json
      INPUT_FOLDER: /data
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8787
      AUDIOMETA_WEB_TOKEN: ${AUDIOMETA_WEB_TOKEN:-}
    command: ["python", "-m", "app.web.server"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8787/api/health', headers={'X-Audiometa-Token': os.getenv('AUDIOMETA_WEB_TOKEN','')}); urllib.request.urlopen(r, timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
